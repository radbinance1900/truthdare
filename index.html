<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare - Adults Only</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TruthOrDareApp = () => {
          const [screen, setScreen] = useState('home');
          const [playerName, setPlayerName] = useState('');
          const [roomCode, setRoomCode] = useState('');
          const [isHost, setIsHost] = useState(false);
          const [connected, setConnected] = useState(false);
          const [currentTurn, setCurrentTurn] = useState('');
          const [choice, setChoice] = useState(null);
          const [question, setQuestion] = useState('');
          const [answer, setAnswer] = useState('');
          const [mediaFile, setMediaFile] = useState(null);
          const [mediaPreview, setMediaPreview] = useState(null);
          const [showAnswer, setShowAnswer] = useState(false);
          const [waitingForClear, setWaitingForClear] = useState(false);
          const [opponentName, setOpponentName] = useState('');
          const [turnSubmitted, setTurnSubmitted] = useState(false);
          const [connectionData, setConnectionData] = useState('');
          const [truthQuestions, setTruthQuestions] = useState([]);
          const [dareQuestions, setDareQuestions] = useState([]);
          const [gameStarted, setGameStarted] = useState(false);
          const [bothReady, setBothReady] = useState(false);
          const [hostReady, setHostReady] = useState(false);
          const [guestReady, setGuestReady] = useState(false);
          const [showRulesPopup, setShowRulesPopup] = useState(false);
          
          const peerConnection = useRef(null);
          const dataChannel = useRef(null);
          const pollingInterval = useRef(null);

          // Show rules popup on first load
          useEffect(() => {
            const hasSeenRules = localStorage.getItem('truthordare_rules_accepted');
            if (!hasSeenRules) {
              setShowRulesPopup(true);
            }
          }, []);

          const acceptRules = () => {
            localStorage.setItem('truthordare_rules_accepted', 'true');
            setShowRulesPopup(false);
          };

          // Screenshot deterrent system
          useEffect(() => {
            // Add watermark when game starts
            if (screen === 'game' && roomCode && playerName) {
              addWatermark();
            }

            // Disable right-click on media
            const handleContextMenu = (e) => {
              if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
                e.preventDefault();
                alert('âš ï¸ Screenshots are prohibited per game rules');
                return false;
              }
            };

            // Detect PrintScreen key (Windows only)
            const handleKeyUp = (e) => {
              if (e.key === 'PrintScreen') {
                alert('âš ï¸ SCREENSHOT DETECTED\n\nScreenshots violate game rules. Your room code and identity are watermarked on all content.');
                console.warn('Screenshot attempt detected in room:', roomCode);
              }
            };

            // Blur screen when window loses focus (possible screenshot)
            const handleVisibilityChange = () => {
              if (document.hidden && screen === 'game') {
                document.body.style.filter = 'blur(15px)';
              } else {
                setTimeout(() => {
                  document.body.style.filter = 'none';
                }, 100);
              }
            };

            // Disable drag on media
            const handleDragStart = (e) => {
              if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
                e.preventDefault();
                return false;
              }
            };

            document.addEventListener('contextmenu', handleContextMenu);
            document.addEventListener('keyup', handleKeyUp);
            document.addEventListener('visibilitychange', handleVisibilityChange);
            document.addEventListener('dragstart', handleDragStart);

            return () => {
              document.removeEventListener('contextmenu', handleContextMenu);
              document.removeEventListener('keyup', handleKeyUp);
              document.removeEventListener('visibilitychange', handleVisibilityChange);
              document.removeEventListener('dragstart', handleDragStart);
              document.body.style.filter = 'none';
              
              // Remove watermark
              const wm = document.getElementById('game-watermark');
              if (wm) wm.remove();
            };
          }, [screen, roomCode, playerName]);

          const addWatermark = () => {
            // Remove existing watermark
            const existing = document.getElementById('game-watermark');
            if (existing) existing.remove();

            // Create new watermark
            const watermark = document.createElement('div');
            watermark.id = 'game-watermark';
            watermark.style.cssText = `
              position: fixed;
              top: 5px;
              right: 5px;
              font-size: 9px;
              color: rgba(255, 255, 255, 0.25);
              font-family: monospace;
              pointer-events: none;
              z-index: 9999;
              text-align: right;
              line-height: 1.3;
              text-shadow: 0 0 3px rgba(0,0,0,0.5);
            `;
            watermark.innerHTML = `Room: ${roomCode}<br>${playerName}<br>${new Date().toLocaleString()}`;
            document.body.appendChild(watermark);
          };

          // Load questions from database on mount
          useEffect(() => {
            const loadQuestions = async () => {
              try {
                const truthRes = await fetch('api.php?action=get_questions&type=truth');
                const truthData = await truthRes.json();
                if (truthData.success) {
                  setTruthQuestions(truthData.questions);
                }
                
                const dareRes = await fetch('api.php?action=get_questions&type=dare');
                const dareData = await dareRes.json();
                if (dareData.success) {
                  setDareQuestions(dareData.questions);
                }
              } catch (err) {
                console.error('Error loading questions:', err);
                // Fallback to default questions if loading fails
                setTruthQuestions([
                  "What's your biggest regret in a past relationship?",
                  "What's the most embarrassing thing you've done while drunk?"
                ]);
                setDareQuestions([
                  "Send a flirty text to someone in your contacts",
                  "Do your best sexy dance for 30 seconds (video proof)"
                ]);
              }
            };
            
            loadQuestions();
          }, []);

          const sendMessage = (data) => {
            if (dataChannel.current && dataChannel.current.readyState === 'open') {
              dataChannel.current.send(JSON.stringify(data));
            }
          };

          const setupDataChannel = (channel) => {
            channel.onopen = () => {
              console.log('Data channel opened');
              setConnected(true);
              
              // Send initial handshake
              sendMessage({ 
                type: 'name', 
                name: playerName,
                isHost: isHost,
                roomCode: roomCode // Share room code
              });
            };

            channel.onmessage = (event) => {
              const data = JSON.parse(event.data);
              
              if (data.type === 'name') {
                setOpponentName(data.name);
                // Guest receives room code from host
                if (!isHost && data.roomCode) {
                  setRoomCode(data.roomCode);
                }
              } else if (data.type === 'ready') {
                // Other player is ready
                if (data.isHost) {
                  setHostReady(true);
                } else {
                  setGuestReady(true);
                }
              } else if (data.type === 'start_game') {
                // Game officially started, host goes first
                setGameStarted(true);
                setBothReady(true);
                setCurrentTurn(data.firstPlayer);
              } else if (data.type === 'choice') {
                setChoice(data.choice);
                setQuestion(data.question);
                setShowAnswer(false);
                setTurnSubmitted(false);
              } else if (data.type === 'answer') {
                setAnswer(data.answer);
                // Don't set media preview from WebRTC - wait for server URL
                if (data.hasMedia) {
                  setMediaPreview('loading'); // Placeholder
                } else {
                  setMediaPreview(null);
                }
                setShowAnswer(true);
                setWaitingForClear(true);
              } else if (data.type === 'media_ready') {
                // Receive media URL from server
                setMediaPreview(data.mediaUrl);
              } else if (data.type === 'clear') {
                setChoice(null);
                setQuestion('');
                setAnswer('');
                setMediaPreview(null);
                setShowAnswer(false);
                setWaitingForClear(false);
                setTurnSubmitted(false);
                setCurrentTurn(currentTurn === playerName ? opponentName : playerName);
              } else if (data.type === 'turnChange') {
                setCurrentTurn(data.turn);
              } else if (data.type === 'end_game') {
                alert(`${data.sender} has ended the game. All data has been deleted.`);
                // Close connection and redirect
                if (peerConnection.current) {
                  peerConnection.current.close();
                }
                window.location.href = 'index.php';
              }
            };

            channel.onclose = () => {
              setConnected(false);
              alert('Connection lost');
              setScreen('home');
            };
          };

          const createRoom = async () => {
            if (!playerName) return;
            
            try {
              const response = await fetch('api.php?action=create_room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerName })
              });
              
              const result = await response.json();
              if (result.success) {
                setRoomCode(result.roomCode);
                setIsHost(true);
                setScreen('waiting');
                
                // Set up WebRTC
                const pc = new RTCPeerConnection({
                  iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                  ]
                });
                peerConnection.current = pc;

                const channel = pc.createDataChannel('game');
                dataChannel.current = channel;
                setupDataChannel(channel);

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const candidates = [];
                pc.onicecandidate = (event) => {
                  if (event.candidate) {
                    candidates.push(event.candidate);
                  }
                };

                setTimeout(async () => {
                  const offerData = {
                    offer: pc.localDescription,
                    candidates: candidates
                  };
                  
                  // Save offer to database
                  await fetch('api.php?action=save_offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                      roomCode: result.roomCode, 
                      offerData: JSON.stringify(offerData) 
                    })
                  });
                  
                  // Start polling for answer
                  pollingInterval.current = setInterval(async () => {
                    const answerResponse = await fetch(`api.php?action=get_answer&roomCode=${result.roomCode}`);
                    const answerResult = await answerResponse.json();
                    
                    if (answerResult.success && answerResult.answer) {
                      clearInterval(pollingInterval.current);
                      const answerData = JSON.parse(answerResult.answer);
                      await pc.setRemoteDescription(answerData.answer);
                      answerData.candidates.forEach(candidate => pc.addIceCandidate(candidate));
                    }
                  }, 1000);
                }, 2000);
              } else {
                alert('Error creating room');
              }
            } catch (err) {
              console.error('Error:', err);
              alert('Error: ' + err.message);
            }
          };

          const joinRoom = async () => {
            if (!playerName || !roomCode) return;
            
            try {
              const response = await fetch('api.php?action=join_room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerName, roomCode })
              });
              
              const result = await response.json();
              if (result.success) {
                setScreen('waiting');
                
                // Get offer from database
                const offerResponse = await fetch(`api.php?action=get_offer&roomCode=${roomCode}`);
                const offerResult = await offerResponse.json();
                
                if (offerResult.success && offerResult.offer) {
                  const offerData = JSON.parse(offerResult.offer);
                  
                  const pc = new RTCPeerConnection({
                    iceServers: [
                      { urls: 'stun:stun.l.google.com:19302' },
                      { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                  });
                  peerConnection.current = pc;

                  pc.ondatachannel = (event) => {
                    dataChannel.current = event.channel;
                    setupDataChannel(event.channel);
                  };

                  await pc.setRemoteDescription(offerData.offer);
                  offerData.candidates.forEach(candidate => pc.addIceCandidate(candidate));

                  const answer = await pc.createAnswer();
                  await pc.setLocalDescription(answer);

                  const candidates = [];
                  pc.onicecandidate = (event) => {
                    if (event.candidate) {
                      candidates.push(event.candidate);
                    }
                  };

                  setTimeout(async () => {
                    const answerData = {
                      answer: pc.localDescription,
                      candidates: candidates
                    };
                    
                    // Save answer to database
                    await fetch('api.php?action=save_answer', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ 
                        roomCode: roomCode, 
                        answerData: JSON.stringify(answerData) 
                      })
                    });
                  }, 2000);
                } else {
                  alert('Room not ready. Host needs to create the room first.');
                  setScreen('home');
                }
              } else {
                alert(result.message || 'Room not found');
              }
            } catch (err) {
              console.error('Error:', err);
              alert('Error: ' + err.message);
            }
          };

          const handleChoice = (selectedChoice) => {
            const questions = selectedChoice === 'truth' ? truthQuestions : dareQuestions;
            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
            
            setChoice(selectedChoice);
            setQuestion(randomQuestion);
            
            sendMessage({
              type: 'choice',
              choice: selectedChoice,
              question: randomQuestion
            });
            
            // Track stat
            fetch('api.php?action=track_stat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                eventType: selectedChoice === 'truth' ? 'truth_played' : 'dare_played',
                roomCode: roomCode,
                playerName: playerName
              })
            }).catch(err => console.log('Stat tracking failed:', err));
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              if (file.size > 15 * 1024 * 1024) {
                alert('File too large. Please choose a file under 15MB.');
                return;
              }
              
              setMediaFile(file);
              const reader = new FileReader();
              reader.onload = (event) => {
                setMediaPreview(event.target.result);
              };
              reader.readAsDataURL(file);
            }
          };

          const submitAnswer = async () => {
            try {
              // Validate room code exists
              if (!roomCode) {
                alert('Error: Room code not found. Please refresh and reconnect.');
                return;
              }
              
              console.log('Submitting answer for room:', roomCode);
              
              // DON'T send large media via WebRTC - only send text answer
              // Send a placeholder for media that will be loaded from server
              const mediaPlaceholder = mediaPreview ? 'MEDIA_UPLOADED' : null;
              
              sendMessage({
                type: 'answer',
                answer: answer,
                media: mediaPlaceholder, // Just a flag, not the actual file
                hasMedia: !!mediaPreview,
                roomCode: roomCode
              });
              
              setShowAnswer(true);
              setTurnSubmitted(true);
              
              // Save media to server FIRST before showing to other player
              if (mediaPreview) {
                console.log('Saving media to server...');
                
                try {
                  const response = await fetch('api.php?action=save_media', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      roomCode: roomCode,
                      fileData: mediaPreview,
                      fileType: mediaFile ? mediaFile.type : 'image/jpeg'
                    })
                  });
                  
                  const result = await response.json();
                  
                  if (result.success) {
                    console.log('Media saved successfully:', result.filename);
                    
                    // Now notify other player with the media URL
                    sendMessage({
                      type: 'media_ready',
                      mediaUrl: result.url,
                      mediaType: mediaFile.type
                    });
                  } else {
                    console.error('Failed to save media:', result.message);
                    alert('Warning: Media upload failed but answer was sent. ' + result.message);
                  }
                } catch (err) {
                  console.error('Error saving media:', err);
                  alert('Warning: Media upload failed but answer was sent.');
                }
              }
              
              // Clear media preview after a delay (don't clear immediately)
              setTimeout(() => {
                setMediaFile(null);
              }, 5000);
              
            } catch (err) {
              console.error('Error submitting answer:', err);
              alert('Error submitting answer. Please try again.');
            }
          };

          const clearAnswer = () => {
            sendMessage({ type: 'clear' });
            
            setChoice(null);
            setQuestion('');
            setAnswer('');
            setMediaPreview(null);
            setShowAnswer(false);
            setWaitingForClear(false);
            setTurnSubmitted(false);
            
            const nextTurn = currentTurn === playerName ? opponentName : playerName;
            setCurrentTurn(nextTurn);
            
            sendMessage({ type: 'turnChange', turn: nextTurn });
          };

          const endGame = async () => {
            if (!confirm('Are you sure you want to end the game? All data will be deleted.')) {
              return;
            }
            
            try {
              // Notify other player
              sendMessage({ type: 'end_game', sender: playerName });
              
              // Delete all game data from server
              await fetch('api.php?action=end_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomCode })
              });
              
              // Close connection
              if (peerConnection.current) {
                peerConnection.current.close();
              }
              
              // Redirect to home
              alert('Game ended. All data has been deleted.');
              window.location.href = 'index.php';
            } catch (err) {
              console.error('Error ending game:', err);
              alert('Game ended.');
              window.location.href = 'index.php';
            }
          };

          const handleReady = () => {
            // Mark self as ready
            if (isHost) {
              setHostReady(true);
            } else {
              setGuestReady(true);
            }
            
            // Notify other player
            sendMessage({ 
              type: 'ready',
              isHost: isHost
            });
          };

          // Check if both players are ready
          useEffect(() => {
            if (hostReady && guestReady && !gameStarted && isHost) {
              // Host initiates game start
              setGameStarted(true);
              setBothReady(true);
              setCurrentTurn(playerName);
              
              // Notify guest to start
              sendMessage({ 
                type: 'start_game',
                firstPlayer: playerName
              });
              
              // Track game started stat
              fetch('api.php?action=track_stat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  eventType: 'game_started',
                  roomCode: roomCode,
                  playerName: playerName
                })
              }).catch(err => console.log('Stat tracking failed:', err));
            }
          }, [hostReady, guestReady, gameStarted, isHost, playerName]);

          // Cleanup on unmount
          useEffect(() => {
            return () => {
              if (pollingInterval.current) {
                clearInterval(pollingInterval.current);
              }
              if (peerConnection.current) {
                peerConnection.current.close();
              }
            };
          }, []);
          
          // Debug logging for room code
          useEffect(() => {
            if (roomCode) {
              console.log('Room code set:', roomCode, 'isHost:', isHost);
            }
          }, [roomCode, isHost]);
          
          // Debug logging for turn state
          useEffect(() => {
            if (connected && currentTurn) {
              console.log('Turn state:', {
                playerName,
                opponentName,
                currentTurn,
                isMyTurn: currentTurn === playerName,
                isHost,
                roomCode
              });
            }
          }, [connected, currentTurn, playerName, opponentName, isHost, roomCode]);

          if (screen === 'home') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-900 via-pink-800 to-red-900 flex flex-col items-center justify-center p-4">
                {showRulesPopup && (
                  <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl animate-fade-in my-4 max-h-[90vh] overflow-y-auto">
                      <div className="text-center mb-4">
                        <div className="text-5xl md:text-6xl mb-3">⚠️</div>
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-2">Game Rules & Warning</h2>
                        <p className="text-red-600 font-bold text-base md:text-lg">This is an R18+ Adults Only 🔞</p>
                      </div>
                      
                      <div className="bg-red-50 border-2 border-red-200 rounded-xl p-4 md:p-6 mb-4">
                        <h3 className="font-bold text-red-800 mb-3 text-base md:text-lg">🔞 Important Rules:</h3>
                        <ul className="space-y-2 md:space-y-3 text-gray-700 text-sm md:text-base">
                          <li className="flex items-start gap-2">
                            <span className="text-red-600 font-bold flex-shrink-0">•</span>
                            <span><strong>STRICTLY NO SCREENSHOTS:</strong> Taking screenshots or screen recordings is absolutely prohibited. All content is watermarked with your identity and room code for traceability.</span>
                          </li>
                          <li className="flex items-start gap-2">
                            <span className="text-red-600 font-bold flex-shrink-0">•</span>
                            <span><strong>Media Auto-Delete:</strong> All photos and videos are automatically deleted after 24 hours or when the game ends. Nothing is stored permanently.</span>
                          </li>
                          <li className="flex items-start gap-2">
                            <span className="text-red-600 font-bold flex-shrink-0">•</span>
                            <span><strong>Privacy Warning:</strong> Only play with people you completely trust. This is a private game between consenting adults. Sharing content may have legal consequences.</span>
                          </li>
                          <li className="flex items-start gap-2">
                            <span className="text-red-600 font-bold flex-shrink-0">•</span>
                            <span><strong>Age Restriction:</strong> You must be 18 years or older to play this game. By accepting, you confirm you meet this requirement.</span>
                          </li>
                          <li className="flex items-start gap-2">
                            <span className="text-red-600 font-bold flex-shrink-0">•</span>
                            <span><strong>Play at Your Own Risk:</strong> By continuing, you acknowledge and accept all risks. Screenshots or sharing of content may result in legal action.</span>
                          </li>
                        </ul>
                      </div>
                      
                      <div className="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-3 md:p-4 mb-4">
                        <p className="text-xs md:text-sm text-yellow-800">
                          <strong>⚡ Disclaimer:</strong> This game is for entertainment purposes only. The creators are not responsible for any actions taken by players. All participants must be consenting adults.
                        </p>
                      </div>
                      
                      <button
                        onClick={acceptRules}
                        className="w-full bg-gradient-to-r from-red-600 to-pink-600 text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg hover:from-red-700 hover:to-pink-700 transition-all shadow-lg sticky bottom-0"
                      >
                        ✓ I Understand & Accept (18+)
                      </button>
                    </div>
                  </div>
                )}
                
                <div className="bg-black bg-opacity-50 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full shadow-2xl">
                  <div className="text-center mb-8">
                    <h1 className="text-5xl font-bold text-white mb-2">Truth or Dare</h1>
                    <p className="text-pink-300 text-lg">Adults Only 🔞</p>
                  </div>
                  
                  <div className="space-y-4">
                    <input
                      type="text"
                      placeholder="Enter your name"
                      value={playerName}
                      onChange={(e) => setPlayerName(e.target.value)}
                      className="w-full px-4 py-3 bg-white bg-opacity-20 text-white placeholder-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400"
                    />
                    
                    <button
                      onClick={createRoom}
                      disabled={!playerName}
                      className="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-pink-600 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                    >
                      👥 Create Room
                    </button>
                    
                    <div className="relative">
                      <div className="absolute inset-0 flex items-center">
                        <div className="w-full border-t border-pink-300"></div>
                      </div>
                      <div className="relative flex justify-center text-sm">
                        <span className="px-4 bg-transparent text-pink-200">or</span>
                      </div>
                    </div>
                    
                    <input
                      type="text"
                      placeholder="Enter 5-digit room code"
                      value={roomCode}
                      onChange={(e) => setRoomCode(e.target.value.replace(/[^0-9]/g, '').substring(0, 5))}
                      maxLength={5}
                      className="w-full px-4 py-3 bg-white bg-opacity-20 text-white placeholder-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-center text-2xl tracking-widest"
                    />
                    
                    <button
                      onClick={joinRoom}
                      disabled={!playerName || roomCode.length !== 5}
                      className="w-full bg-gradient-to-r from-purple-500 to-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:from-purple-600 hover:to-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                    >
                      📡 Join Room
                    </button>
                  </div>
                </div>
                
                <div className="mt-6 text-center space-y-1 max-w-md w-full">
                  <p className="text-pink-200 text-sm">🔥 Spicy questions for adults</p>
                  <p className="text-pink-200 text-sm">📱 Play remotely with friends</p>
                  <p className="text-pink-200 text-sm">🎲 Take turns, no limits</p>
                </div>
              </div>
            );
          }

          if (screen === 'waiting') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-900 via-pink-800 to-red-900 flex flex-col items-center justify-center p-4">
                <div className="bg-black bg-opacity-50 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full shadow-2xl">
                  <div className="text-center mb-6">
                    <div className="animate-pulse mb-4 text-6xl">
                      📡
                    </div>
                    <h2 className="text-3xl font-bold text-white mb-4">
                      {connected ? 'Connected!' : 'Waiting for player...'}
                    </h2>
                    {isHost && !connected && (
                      <>
                        <p className="text-pink-200 mb-4">Share this 5-digit code:</p>
                        <div className="bg-white bg-opacity-20 p-6 rounded-xl mb-4">
                          <p className="text-white font-bold text-5xl tracking-widest">{roomCode}</p>
                        </div>
                        <p className="text-pink-300 text-sm">Waiting for player to join...</p>
                      </>
                    )}
                    {!isHost && !connected && (
                      <p className="text-pink-200">Connecting to room {roomCode}...</p>
                    )}
                    {connected && opponentName && (
                      <div className="mt-6">
                        <p className="text-pink-200 text-lg">Playing with:</p>
                        <p className="text-white text-2xl font-bold">{opponentName}</p>
                        <button
                          onClick={() => setScreen('game')}
                          className="mt-6 w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:from-green-600 hover:to-emerald-700 transition-all"
                        >
                          Start Game
                        </button>
                      </div>
                    )}
                  </div>
                </div>
                
                <div className="mt-6 text-center space-y-1 max-w-md w-full">
                  <p className="text-pink-200 text-sm">🔥 Spicy questions for adults</p>
                  <p className="text-pink-200 text-sm">📱 Play remotely with friends</p>
                  <p className="text-pink-200 text-sm">🎲 Take turns, no limits</p>
                </div>
              </div>
            );
          }

          if (screen === 'game') {
            const isMyTurn = currentTurn === playerName;
            
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-900 via-pink-800 to-red-900 flex flex-col p-4">
                <div className="max-w-2xl mx-auto w-full flex-grow">
                  <div className="bg-black bg-opacity-50 backdrop-blur-lg rounded-3xl p-6 shadow-2xl">
                    <div className="flex justify-between items-center mb-6">
                      <div>
                        <h3 className="text-white text-xl font-bold">{playerName}</h3>
                        {isMyTurn && gameStarted && <span className="text-green-400 text-sm">Your turn</span>}
                        {isHost && (hostReady ? <span className="text-yellow-400 text-sm">✓ Ready</span> : null)}
                        {!isHost && (guestReady ? <span className="text-yellow-400 text-sm">✓ Ready</span> : null)}
                      </div>
                      <div className="text-right">
                        <h3 className="text-white text-xl font-bold">{opponentName}</h3>
                        {!isMyTurn && gameStarted && <span className="text-green-400 text-sm">Their turn</span>}
                        {isHost && (guestReady ? <span className="text-yellow-400 text-sm">✓ Ready</span> : null)}
                        {!isHost && (hostReady ? <span className="text-yellow-400 text-sm">✓ Ready</span> : null)}
                      </div>
                    </div>
                    
                    <div className="mb-4">
                      <button
                        onClick={endGame}
                        className="w-full bg-gradient-to-r from-red-500 to-red-700 text-white py-3 rounded-xl font-bold text-sm hover:from-red-600 hover:to-red-800 transition-all"
                      >
                        🚪 End Game
                      </button>
                    </div>

                    {!gameStarted && (
                      <div className="text-center py-8">
                        <h2 className="text-3xl font-bold text-white mb-6">Ready to Play?</h2>
                        <p className="text-pink-200 mb-8">
                          {isHost ? "You'll go first!" : `${opponentName} will go first!`}
                        </p>
                        
                        {(isHost && !hostReady) || (!isHost && !guestReady) ? (
                          <button
                            onClick={handleReady}
                            className="bg-gradient-to-r from-green-500 to-emerald-600 text-white py-4 px-8 rounded-xl font-bold text-xl hover:from-green-600 hover:to-emerald-700 transition-all"
                          >
                            ✓ I'm Ready!
                          </button>
                        ) : (
                          <div className="text-yellow-300 animate-pulse">
                            Waiting for {isHost ? opponentName : opponentName} to be ready...
                          </div>
                        )}
                      </div>
                    )}

                    {gameStarted && waitingForClear && !isMyTurn && (
                      <div className="mb-6">
                        <button
                          onClick={clearAnswer}
                          className="w-full bg-gradient-to-r from-blue-500 to-cyan-600 text-white py-4 rounded-xl font-bold text-lg hover:from-blue-600 hover:to-cyan-700 transition-all"
                        >
                          ✓ Clear & Continue
                        </button>
                      </div>
                    )}

                    {gameStarted && !choice && isMyTurn && !waitingForClear && (
                      <div className="space-y-4">
                        <h2 className="text-3xl font-bold text-white text-center mb-8">Choose wisely...</h2>
                        <button
                          onClick={() => handleChoice('truth')}
                          className="w-full bg-gradient-to-r from-blue-500 to-cyan-600 text-white py-6 rounded-xl font-bold text-2xl hover:from-blue-600 hover:to-cyan-700 transition-all"
                        >
                          Truth
                        </button>
                        <button
                          onClick={() => handleChoice('dare')}
                          className="w-full bg-gradient-to-r from-red-500 to-orange-600 text-white py-6 rounded-xl font-bold text-2xl hover:from-red-600 hover:to-orange-700 transition-all"
                        >
                          Dare
                        </button>
                      </div>
                    )}

                    {gameStarted && choice && !showAnswer && (
                      <div className="space-y-6">
                        <div className="bg-white bg-opacity-10 p-6 rounded-xl">
                          <div className="text-pink-300 text-sm uppercase mb-2">{choice}</div>
                          <p className="text-white text-xl">{question}</p>
                        </div>

                        {isMyTurn && !turnSubmitted && (
                          <div className="space-y-4">
                            <input
                              type="text"
                              placeholder={choice === 'dare' ? "Type your answer (optional if uploading media)..." : "Type your answer..."}
                              value={answer}
                              onChange={(e) => setAnswer(e.target.value)}
                              className="w-full px-4 py-3 bg-white bg-opacity-20 text-white placeholder-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400"
                            />

                            {choice === 'dare' && (
                              <div>
                                <label className="flex items-center justify-center gap-2 bg-white bg-opacity-20 text-white py-3 rounded-xl cursor-pointer hover:bg-opacity-30 transition-all">
                                  📤 {mediaFile ? mediaFile.name : 'Upload Photo/Video (Optional - Max 15MB)'}
                                  <input
                                    type="file"
                                    accept="image/*,video/*"
                                    onChange={handleFileUpload}
                                    className="hidden"
                                  />
                                </label>
                                {mediaPreview && (
                                  <div className="mt-4 rounded-xl overflow-hidden">
                                    {mediaFile?.type.startsWith('video') ? (
                                      <video src={mediaPreview} controls className="w-full" />
                                    ) : (
                                      <img src={mediaPreview} alt="Preview" className="w-full" />
                                    )}
                                  </div>
                                )}
                              </div>
                            )}

                            <button
                              onClick={submitAnswer}
                              disabled={!answer && !mediaPreview}
                              className="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:from-green-600 hover:to-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                            >
                              📨 Submit Answer
                            </button>
                            
                            {!answer && !mediaPreview && (
                              <p className="text-center text-yellow-300 text-sm mt-2">
                                Please provide text answer, media, or both
                              </p>
                            )}
                          </div>
                        )}

                        {!isMyTurn && (
                          <div className="text-center text-pink-300 py-8">
                            <div className="animate-pulse">Waiting for {opponentName} to answer...</div>
                          </div>
                        )}
                      </div>
                    )}

                    {gameStarted && showAnswer && (
                      <div className="space-y-6">
                        <div className="bg-white bg-opacity-10 p-6 rounded-xl">
                          <div className="text-pink-300 text-sm uppercase mb-2">{choice}</div>
                          <p className="text-white text-xl mb-4">{question}</p>
                          <div className="border-t border-pink-400 pt-4">
                            <div className="text-green-300 text-sm uppercase mb-2">Answer:</div>
                            <p className="text-white text-lg">{answer}</p>
                            {mediaPreview && mediaPreview !== 'loading' && (
                              <div className="mt-4 rounded-xl overflow-hidden">
                                {mediaPreview.startsWith('data:video') || mediaPreview.includes('.mp4') || mediaPreview.includes('.webm') ? (
                                  <video src={mediaPreview.startsWith('http') || mediaPreview.startsWith('media/') ? mediaPreview : mediaPreview} controls className="w-full" />
                                ) : (
                                  <img src={mediaPreview.startsWith('http') || mediaPreview.startsWith('media/') ? mediaPreview : mediaPreview} alt="Response" className="w-full" />
                                )}
                              </div>
                            )}
                            {mediaPreview === 'loading' && (
                              <div className="mt-4 text-center text-yellow-300 animate-pulse">
                                Loading media...
                              </div>
                            )}
                          </div>
                        </div>

                        {!isMyTurn && !waitingForClear && (
                          <div className="text-center text-pink-300 py-4">
                            <div className="animate-pulse">Waiting for {opponentName} to clear...</div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="text-center mt-4">
                    <p className="text-pink-200 text-sm">🔒 No data is saved • Media auto-deletes after 24hrs</p>
                  </div>
                </div>
                
                <div className="mt-6 text-center space-y-1 max-w-2xl mx-auto w-full">
                  <p className="text-pink-200 text-sm">🔥 Spicy questions for adults</p>
                  <p className="text-pink-200 text-sm">📱 Play remotely with friends</p>
                  <p className="text-pink-200 text-sm">🎲 Take turns, no limits</p>
                </div>
              </div>
            );
          }

          return null;
        };

        ReactDOM.render(<TruthOrDareApp />, document.getElementById('root'));
    </script>
